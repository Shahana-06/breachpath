services:
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/breachpath123
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4j_data:/data"]
  backend:
    build: ./backend
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: breachpath123
    depends_on: [neo4j]
    ports: ["8000:8000"]
    # for live AWS scans on EC2 attach an IAM instance role; locally you can mount ~/.aws:
    # volumes: ["~/.aws:/root/.aws:ro"]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["80:80"]
volumes:
  neo4j_data:
